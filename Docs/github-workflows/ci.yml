name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test (macOS)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Show toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || true
          xcodebuild -version
          swift --version

      - name: Test
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
          BUILD_PATH: /tmp/open-lan-scanner-build
        run: swift test --build-path "$BUILD_PATH"

      - name: Package app (validate)
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
          BUILD_PATH: /tmp/open-lan-scanner-build
          CREATE_DMG: "1"
        run: |
          chmod +x Scripts/*.sh
          VERSION="$(tr -d '[:space:]' < VERSION)"
          export VERSION
          export BUILD_NUMBER="${{ github.run_number }}"
          ./Scripts/package-release.sh
          test -f dist/OpenLANScanner.app/Contents/Resources/AppIcon.icns
          test -x dist/OpenLANScanner.app/Contents/MacOS/OpenLANScanner
          ./Scripts/validate-archive-contents.sh dist

      - name: Upload CI artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OpenLANScanner-ci-${{ github.sha }}
          path: |
            dist/OpenLANScanner-*.zip
            dist/OpenLANScanner-*.dmg
            dist/SHA256SUMS.txt
            dist/build-metadata.txt
          if-no-files-found: error
